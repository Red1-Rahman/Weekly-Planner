<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Routine Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="max-w-5xl mx-auto px-4 pt-6 flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold">Routine</h1>
    <div class="flex flex-wrap items-center gap-2">
      <span id="tz-badge" class="rounded-full border border-slate-300 bg-white px-3 py-1 text-sm font-mono">detecting timezone…</span>
      <span id="role-badge" class="rounded-full bg-slate-200 text-slate-700 px-3 py-1 text-sm">Guest</span>
      <button id="login-toggle" class="rounded-lg bg-slate-900 text-white px-3 py-1 text-sm">Login as Redwan</button>
      <button id="logout-btn" class="hidden rounded-lg border border-slate-300 bg-white px-3 py-1 text-sm">Switch to guest</button>
    </div>
  </header>

  <!-- Login as Redwan -->
  <div id="login-panel" class="hidden max-w-5xl mx-auto px-4 mt-4">
    <form id="login-form" class="rounded-2xl bg-white border border-slate-200 p-4 flex flex-wrap gap-2 items-center">
      <input id="login-password" type="password" required autocomplete="current-password"
             placeholder="Password" class="flex-1 min-w-[12rem] rounded-lg border border-slate-300 px-3 py-2" />
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2">Login</button>
      <button type="button" id="login-cancel" class="rounded-lg border border-slate-300 bg-white px-4 py-2">Cancel</button>
      <p id="login-error" class="w-full text-sm text-red-600 min-h-[1.25rem]"></p>
    </form>
  </div>

  <main class="max-w-5xl mx-auto p-4 grid gap-4 md:grid-cols-2">
    <!-- Countdown -->
    <section class="rounded-2xl bg-white border border-slate-200 p-5 flex flex-col items-center">
      <div class="w-full flex items-start justify-between gap-3">
        <div>
          <p id="weekday" class="text-sm text-slate-500">—</p>
          <p id="clock" class="font-mono text-2xl">--:--:--</p>
        </div>
        <div class="inline-flex rounded-lg border border-slate-300 overflow-hidden text-sm">
          <button id="mode-ring" class="px-3 py-1.5 aria-pressed:bg-slate-900 aria-pressed:text-white">Ring</button>
          <button id="mode-hourglass" class="px-3 py-1.5 aria-pressed:bg-slate-900 aria-pressed:text-white">Hourglass</button>
        </div>
      </div>

      <div class="mt-5 h-48 w-48 flex items-center justify-center">
        <svg id="ring-view" viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="10" />
          <circle id="ring-fg" cx="60" cy="60" r="54" fill="none" stroke="#059669" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="339.29" stroke-dashoffset="0" />
        </svg>
        <svg id="hourglass-view" viewBox="0 0 60 100" class="hidden h-full w-auto">
          <defs>
            <clipPath id="clip-top"><polygon points="8,4 52,4 30,50" /></clipPath>
            <clipPath id="clip-bottom"><polygon points="30,50 8,96 52,96" /></clipPath>
          </defs>
          <polygon points="8,4 52,4 30,50 52,96 8,96 30,50" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-linejoin="round" />
          <rect id="sand-top" x="0" y="50" width="60" height="0" fill="#f59e0b" clip-path="url(#clip-top)" />
          <rect id="sand-bottom" x="0" y="96" width="60" height="0" fill="#f59e0b" clip-path="url(#clip-bottom)" />
        </svg>
      </div>

      <p id="cd-label" class="mt-4 font-medium text-center break-words max-w-full">—</p>
      <p id="cd-time" class="font-mono text-3xl mt-1">--:--:--</p>
      <p id="cd-sub" class="text-sm text-slate-500"></p>
    </section>

    <!-- Routine -->
    <section class="rounded-2xl bg-white border border-slate-200 p-5">
      <h2 class="font-semibold mb-3">Today's routine</h2>
      <ul id="routine-list" class="space-y-2"></ul>
    </section>

    <!-- Tasks -->
    <section class="md:col-span-2 rounded-2xl bg-white border border-slate-200 p-5">
      <h2 class="font-semibold mb-3">Tasks <span class="text-sm font-normal text-slate-500">(today only, future times)</span></h2>
      <form id="task-form" class="flex flex-wrap items-center gap-2">
        <input id="task-title" required maxlength="200" placeholder="New task"
               class="flex-1 min-w-[12rem] rounded-lg border border-slate-300 px-3 py-2" />
        <div class="flex items-center gap-1">
          <select id="task-hour" aria-label="Hour" class="rounded-lg border border-slate-300 px-2 py-2 bg-white"></select>
          <span class="font-mono">:</span>
          <select id="task-minute" aria-label="Minute" class="rounded-lg border border-slate-300 px-2 py-2 bg-white"></select>
        </div>
        <button class="rounded-lg bg-slate-900 text-white px-4 py-2">Add</button>
      </form>
      <p id="task-error" class="text-sm text-red-600 min-h-[1.25rem] mt-1"></p>
      <p id="readonly-note" class="hidden text-sm text-slate-500 mt-1">Viewing as guest. Log in as Redwan to add or change tasks.</p>
      <ul id="task-list" class="space-y-2 mt-2"></ul>
    </section>
  </main>

  <div id="banner" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-red-600 text-white px-4 py-2 text-sm shadow"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
