# "auto" = use the timezone of the device opening the app.
# Or set an IANA name, e.g. "Asia/Dhaka".
timezone: auto

# Prayer-time anchors used inside time ranges below.
# 24-hour clock. Approximate values - update them seasonally.
anchors:
  Fajr: "04:45"
  Zuhr: "12:05"
  Asr: "15:35"
  Magrib: "18:00"
  Esha: "19:20"

# Time tokens: "HH:MM" or an anchor name (Fajr, Zuhr, Asr, Magrib, Esha).
# A block is "<start>-<end>". Blocks must not cross midnight.
days:
